<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOWNS - Copiar e Colar Integrado</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff6600;
      --accent-hover: #e05500;
      --text-color: #ffffff;
      --text-dim: #a0a0b0;
      --border-color: #32323d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
    }

    h1 { font-size: 1.4rem; color: var(--accent-color); text-align: center; margin-bottom: 8px; }
    p.subtitle { font-size: 0.85rem; color: var(--text-dim); text-align: center; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-dim); }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    .qr-container {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
    }

    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-secondary {
      background-color: #2a2a35;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .details {
      margin-top: 16px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 0.75rem;
      word-break: break-all;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>WOWNS Registrar</h1>
    <p class="subtitle">Copie a string completa e cole no campo de envio da carteira</p>

    <div class="form-group">
      <label for="domainInput">Nome desejado (.wow):</label>
      <input type="text" id="domainInput" value="gostosao.wow" oninput="updateDetails()">
    </div>

    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <div class="btn-group">
      <!-- Opção 1: Copia a String URI que a Stack Wallet lê diretamente da área de transferência -->
      <button class="btn" onclick="copyFullURI()">Copiar Dados de Envio (URI)</button>
      
      <!-- Opção 2: Copia apenas o Hex se preferir colar manualmente -->
      <button class="btn btn-secondary" onclick="copyPaymentID()">Copiar apenas o Payment ID (Hex)</button>
    </div>

    <div class="details">
      <p><strong>Destino:</strong> <span id="destAddr"></span></p>
      <p><strong>Valor:</strong> <span>0.00000001 WOW</span></p>
      <p style="margin-top: 4px;"><strong>Payment ID (16 Chars Hex):</strong> <span id="hexPayload"></span></p>
    </div>
  </div>

  <script>
    const RECEIVER = "WW3gpjsmrXZWzQyygTVjUGcX8d8Q4DajCcy9LMegTAet6itQGLec1EhWGbAuBsE8FydU1NCQe8fUkfE6MvWjXuzK2U6GL9dHE";
    const AMOUNT = "0.00000001";
    let currentURI = "";

    document.getElementById("destAddr").innerText = RECEIVER.substring(0, 10) + "..." + RECEIVER.substring(RECEIVER.length - 8);

    // Converte a string para exatamente 16 caracteres hexadecimais (8 bytes)
    function stringTo8ByteHex(str) {
      let hex = '';
      for (let i = 0; i < str.length; i++) {
        hex += str.charCodeAt(i).toString(16).padStart(2, '0');
      }
      // Trunca em 16 chars ou preenche com '0' até dar 16 chars
      return hex.padEnd(16, '0').substring(0, 16);
    }

    function updateDetails() {
      const domain = document.getElementById("domainInput").value.trim() || "anonymous.wow";
      
      // Gera o Payment ID curto de 8 bytes (compatível com carteiras)
      const hex8Bytes = stringTo8ByteHex(`W:${domain}`);
      
      // String URI oficial do Wownero/Monero
      currentURI = `wownero:${RECEIVER}?tx_amount=${AMOUNT}&tx_payment_id=${hex8Bytes}`;

      document.getElementById("hexPayload").innerText = hex8Bytes;

      // Atualiza o QR Code
      const qrElement = document.getElementById("qrcode");
      qrElement.innerHTML = "";
      new QRCode(qrElement, { text: currentURI, width: 160, height: 160 });
    }

    function copyFullURI() {
      // Ao copiar a URI inteira, a Stack Wallet identifica todos os parâmetros na cola
      navigator.clipboard.writeText(currentURI);
      alert("String de Envio Copiada!\n\nAbra a Stack Wallet e cole diretamente no campo de endereço de envio.");
    }

    function copyPaymentID() {
      const hex = document.getElementById("hexPayload").innerText;
      navigator.clipboard.writeText(hex);
      alert("Payment ID (16 caracteres Hex) copiado!");
    }

    window.onload = updateDetails;
  </script>

</body>
</html>
