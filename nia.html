<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Animado Interativo</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Topo: Configurações e Chave de API -->
        <div class="bg-slate-950/50 p-4 border-b border-slate-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Gemini Key:</span>
                <input type="password" id="apiKeyInput" placeholder="Cole sua API Key aqui" class="bg-slate-900 border border-slate-700 text-sm rounded px-3 py-1.5 w-full sm:w-48 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">Personagem:</span>
                <select id="personagemSelect" class="bg-slate-900 border border-slate-700 text-sm rounded px-2 py-1.5 focus:outline-none focus:border-emerald-500">
                    <option value="fagulha">Fagulha (Brincalhão)</option>
                    <option value="luna">Luna (Sábia/Calma)</option>
                </select>
            </div>
        </div>

        <!-- Palco do Personagem (Canvas) -->
        <div class="relative w-full h-72 bg-gradient-to-b from-slate-900 to-slate-950 flex items-center justify-center border-b border-slate-800 overflow-hidden">
            <!-- Balão de Fala -->
            <div id="balaoFala" class="absolute top-4 left-6 right-6 bg-slate-800/90 border border-slate-700 text-slate-200 text-sm px-4 py-3 rounded-xl shadow-lg backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-none z-10 text-center">
                ...
            </div>
            <!-- Canvas onde o personagem é desenhado e animado -->
            <canvas id="canvasPersonagem" width="400" height="250" class="w-full h-full object-contain"></canvas>
        </div>

        <!-- Histórico de Conversa Recente -->
        <div id="chatLog" class="p-4 h-36 overflow-y-auto flex flex-col gap-2 text-sm text-slate-300 bg-slate-900/50">
            <div class="text-slate-500 italic text-center text-xs">A conversa aparecerá aqui... Clique no microfone para falar.</div>
        </div>

        <!-- Controles Inferior (Microfone e Status) -->
        <div class="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="btnMic" class="w-12 h-12 rounded-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all flex items-center justify-center shadow-lg shadow-emerald-900/40 cursor-pointer">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </button>
                <div>
                    <div id="statusTexto" class="text-xs font-medium text-slate-400">Pronto para ouvir</div>
                    <div id="transcricao" class="text-xs text-slate-500 truncate max-w-[200px] sm:max-w-xs"></div>
                </div>
            </div>
            <div id="indicadorFala" class="hidden items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce [animation-delay:0.4s]"></span>
            </div>
        </div>

    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DO CANVAS E PERSONAGEM ---
        const canvas = document.getElementById('canvasPersonagem');
        const ctx = canvas.getContext('2d');

        let estadoPersonagem = 'idle'; // idle, pensando, falando
        let bocaAbertura = 0; // 0 (fechada) a 1 (aberta) para lip-sync
        let anguloFlutuacao = 0;
        let piscarOlho = false;
        
        // Cores e propriedades baseadas no tipo de personagem
        const tiposPersonagens = {
            fagulha: { corCorpo: '#0ea5e9', corBrilho: '#38bdf8', nome: 'Fagulha', personalidade: 'Você é o Fagulha, um assistente virtual brincalhão, energético e amigável criado em navegador. Responda de forma curta e divertida em português.' },
            luna: { corCorpo: '#8b5cf6', corBrilho: '#a78bfa', nome: 'Luna', personalidade: 'Você é a Luna, uma assistente virtual calma, sábia e poética. Responda de forma curta e acolhedora em português.' }
        };

        // Loop de Animação do Canvas (Rodando a 60fps)
        function desenharPersonagem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Animação de flutuação suave (senoide)
            anguloFlutuacao += 0.05;
            const offsetY = Math.sin(anguloFlutuacao) * 6;

            const config = tiposPersonagens[document.getElementById('personagemSelect').value];

            // Centro do personagem
            const cx = canvas.width / 2;
            const cy = (canvas.height / 2) + offsetY;

            // Sombra no chão
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 75, 40, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Antenas / Brilhos superiores
            ctx.strokeStyle = config.corBrilho;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 15, cy - 50);
            ctx.lineTo(cx - 25, cy - 75);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx + 15, cy - 50);
            ctx.lineTo(cx + 25, cy - 75);
            ctx.stroke();

            // Bolinhas das antenas
            ctx.fillStyle = config.corBrilho;
            ctx.beginPath();
            ctx.arc(cx - 25, cy - 78, 6, 0, Math.PI * 2);
            ctx.arc(cx + 25, cy - 78, 6, 0, Math.PI * 2);
            ctx.fill();

            // Corpo Principal (Arredondado / Blob)
            ctx.fillStyle = config.corCorpo;
            ctx.beginPath();
            ctx.roundRect(cx - 50, cy - 50, 100, 100, 35);
            ctx.fill();

            // Brilho interno (efeito 3D simples)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15);';
            ctx.beginPath();
            ctx.roundRect(cx - 42, cy - 42, 40, 30, 15);
            ctx.fill();

            // Olhos
            ctx.fillStyle = '#ffffff';
            if (!piscarOlho) {
                // Olhos abertos
                ctx.beginPath();
                ctx.arc(cx - 20, cy - 10, 10, 0, Math.PI * 2);
                ctx.arc(cx + 20, cy - 10, 10, 0, Math.PI * 2);
                ctx.fill();

                // Pupilas
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(cx - 18, cy - 10, 4, 0, Math.PI * 2);
                ctx.arc(cx + 22, cy - 10, 4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Olhos piscando (linha)
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx - 28, cy - 10); ctx.lineTo(cx - 12, cy - 10);
                ctx.moveTo(cx + 12, cy - 10); ctx.lineTo(cx + 28, cy - 10);
                ctx.stroke();
            }

            // Boca Dinâmica (Lip-Sync baseada na variável bocaAbertura)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            const alturaBoca = 4 + (bocaAbertura * 16);
            const larguraBoca = 16;
            ctx.roundRect(cx - (larguraBoca / 2), cy + 12, larguraBoca, alturaBoca, 6);
            ctx.fill();

            // Se estiver pensando, desenha pequenas partículas ao redor
            if (estadoPersonagem === 'pensando') {
                ctx.fillStyle = '#facc15';
                const pTime = Date.now() * 0.005;
                ctx.beginPath();
                ctx.arc(cx + Math.cos(pTime) * 65, cy + Math.sin(pTime) * 65 - 20, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(desenharPersonagem);
        }
        requestAnimationFrame(desenharPersonagem);

        // Piscar de olhos aleatório
        setInterval(() => {
            piscarOlho = true;
            setTimeout(() => { piscarOlho = false; }, 150);
        }, 4000);


        // --- 2. RECONHECIMENTO DE VOZ (SPEECH-TO-TEXT) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = async (event) => {
                const textoFalado = event.results[0][0].transcript;
                document.getElementById('transcricao').innerText = `Você disse: "${textoFalado}"`;
                adicionarMensagemChat('Você', textoFalado);
                
                // Enviar para a IA
                await processarConversaIA(textoFalado);
            };

            recognition.onerror = (event) => {
                document.getElementById('statusTexto').innerText = 'Erro no microfone. Tente novamente.';
                pararEscutaVisual();
            };

            recognition.onend = () => {
                if (estadoPersonagem === 'ouvindo') {
                    pararEscutaVisual();
                }
            };
        } else {
            alert('Seu navegador não suporta reconhecimento de voz nativo. Use o Google Chrome.');
        }

        const btnMic = document.getElementById('btnMic');
        btnMic.addEventListener('click', () => {
            if (!recognition) return;
            if (estadoPersonagem === 'falando') return;

            try {
                recognition.start();
                estadoPersonagem = 'ouvindo';
                document.getElementById('statusTexto').innerText = 'Ouvindo... Pode falar!';
                btnMic.classList.add('bg-red-600', 'animate-pulse');
            } catch (e) {
                recognition.stop();
                pararEscutaVisual();
            }
        });

        function pararEscutaVisual() {
            if (estadoPersonagem === 'ouvindo') estadoPersonagem = 'idle';
            document.getElementById('statusTexto').innerText = 'Pronto para ouvir';
            btnMic.classList.remove('bg-red-600', 'animate-pulse');
        }


        // --- 3. INTEGRAÇÃO COM A API DO GEMINI ---
        async function processarConversaIA(mensagemUsuario) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('Por favor, insira sua chave da API do Gemini no topo da tela.');
                pararEscutaVisual();
                return;
            }

            estadoPersonagem = 'pensando';
            document.getElementById('statusTexto').innerText = 'Pensando...';
            document.getElementById('indicadorFala').style.display = 'flex';

            const tipoKey = document.getElementById('personagemSelect').value;
            const promptSistema = tiposPersonagens[tipoKey].personalidade;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: `${promptSistema}\n\nUsuário: ${mensagemUsuario}` }] }
                        ]
                    })
                });

                const data = await response.json();
                const respostaTexto = data.candidates?.[0]?.content?.parts?.[0]?.text || "Desculpe, não consegui pensar em uma resposta agora.";

                adicionarMensagemChat(tiposPersonagens[tipoKey].nome, respostaTexto);
                mostrarBalaoFala(respostaTexto);
                
                // Falar a resposta em voz alta e animar a boca
                falarTexto(respostaTexto);

            } catch (error) {
                console.error(error);
                document.getElementById('statusTexto').innerText = 'Erro ao comunicar com a IA.';
                estadoPersonagem = 'idle';
            } finally {
                document.getElementById('indicadorFala').style.display = 'none';
            }
        }


        // --- 4. SÍNTESE DE VOZ E LIP-SYNC (TEXT-TO-SPEECH) ---
        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) {
                estadoPersonagem = 'idle';
                return;
            }

            window.speechSynthesis.cancel(); // Cancela falas anteriores
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05; // Velocidade um pouco mais dinâmica

            // Selecionar voz em português se disponível
            const vozes = window.speechSynthesis.getVoices();
            const vozPt = vozes.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
            if (vozPt) utterance.voice = vozPt;

            estadoPersonagem = 'falando';
            document.getElementById('statusTexto').innerText = 'Falando...';

            // Simulação de Lip-Sync (movimento aleatório da boca enquanto fala)
            const intervaloLipSync = setInterval(() => {
                bocaAbertura = Math.random();
            }, 100);

            utterance.onend = () => {
                clearInterval(intervaloLipSync);
                bocaAbertura = 0;
                estadoPersonagem = 'idle';
                document.getElementById('statusTexto').innerText = 'Pronto para ouvir';
                esconderBalaoFala();
            };

            utterance.onerror = () => {
                clearInterval(intervaloLipSync);
                bocaAbertura = 0;
                estadoPersonagem = 'idle';
                document.getElementById('statusTexto').innerText = 'Pronto para ouvir';
            };

            window.speechSynthesis.speak(utterance);
        }


        // --- UTILITÁRIOS DE UI ---
        function mostrarBalaoFala(texto) {
            const balao = document.getElementById('balaoFala');
            balao.innerText = texto;
            balao.classList.remove('opacity-0');
        }

        function esconderBalaoFala() {
            const balao = document.getElementById('balaoFala');
            balao.classList.add('opacity-0');
        }

        function adicionarMensagemChat(autor, texto) {
            const chatLog = document.getElementById('chatLog');
            // Remove mensagem de boas-vindas se existir
            if (chatLog.children.length === 1 && chatLog.children[0].classList.contains('italic')) {
                chatLog.innerHTML = '';
            }
            const div = document.createElement('div');
            div.innerHTML = `<span class="font-semibold text-emerald-400">${autor}:</span> ${texto}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
