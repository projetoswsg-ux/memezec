<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Wownero Node Live Tracker</title>
    <style>
        body { font-family: sans-serif; background: #0c0c0e; color: #e2e2e6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #ff9900; }
        .status { padding: 8px; border-radius: 4px; background: #2a1b02; color: #ff9900; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        .status.online { background: #092416; color: #00ff88; }
        .card { background: #16161a; border: 1px solid #2d2d35; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .hex { font-family: monospace; color: #888894; font-size: 11px; word-break: break-all; background: #212127; padding: 6px; border-radius: 4px; }
        .text { background: #0d211a; border-left: 4px solid #00ff88; padding: 10px; font-size: 16px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Wownero Live Tracker via Node</h1>
    <div id="status" class="status">Conectando ao nó StackWallet...</div>
    <div id="feed"><i>Aguardando atualizações da blockchain...</i></div>
</div>

<script>
    // Usando o nó que está funcionando com HTTPS e CORS aberto
    const NODE_URL = "https://stackwallet.com";
    let lastBlockHeight = 0;

    // Função para traduzir o hexadecimal limpo em UTF-8
    function hexToUtf8(hex) {
        let cleanHex = hex.trim().replace(/(00)+$/, '');
        if (cleanHex.length < 2) return null;
        try {
            let bytes = new Uint8Array(cleanHex.length / 2);
            for (let i = 0; i < cleanHex.length; i += 2) {
                bytes[i / 2] = parseInt(cleanHex.substr(i, 2), 16);
            }
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            // Só exibe se for um texto legível (evita mostrar chaves criptográficas normais)
            return /^[\x20-\x7E\sÁ-ÿ]+$/.test(text) && text.trim().length > 3 ? text : null;
        } catch (e) { return null; }
    }

    // Faz requisições oficiais em formato RPC para o nó de criptomoeda
    async function callNodeRpc(method, params = {}) {
        const response = await fetch(NODE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jsonrpc: "2.0", id: "0", method: method, params: params })
        });
        const json = await response.json();
        return json.result;
    }

    async function checkNodeUpdates() {
        try {
            // 1. Pega a altura do bloco atual na rede
            const info = await callNodeRpc("get_info");
            const currentHeight = info.height - 1;
            
            document.getElementById('status').innerText = `Conectado - Bloco Atual: #${currentHeight}`;
            document.getElementById('status').className = "status online";

            if (lastBlockHeight === 0) {
                lastBlockHeight = currentHeight - 2; // Começa olhando os últimos 2 blocos minerados
            }

            // 2. Vasculha os blocos novos atrás de transações
            for (let h = lastBlockHeight + 1; h <= currentHeight; h++) {
                const blockData = await callNodeRpc("get_block", { height: h });
                const blockJson = JSON.parse(blockData.json);
                
                // Varre as chaves dentro das transações do bloco
                if (blockJson.tx_hashes) {
                    // Pega os detalhes brutos das transações do bloco
                    const txsDetails = await callNodeRpc("get_transactions", { txs_hashes: blockJson.tx_hashes, decode_as_json: true });
                    
                    if (txsDetails.txs_as_json) {
                        txsDetails.txs_as_json.forEach((txString, index) => {
                            const tx = JSON.parse(txString);
                            
                            // Procura textos legíveis nos Outputs (WOWNS)
                            if (tx.vout) {
                                tx.vout.forEach(output => {
                                    if (output.target && output.target.key) {
                                        let txt = hexToUtf8(output.target.key);
                                        if (txt) renderMessage(txt, output.target.key, h, txsDetails.txs[index].tx_hash);
                                    }
                                });
                            }
                        });
                    }
                }
            }
            lastBlockHeight = currentHeight;
        } catch (err) {
            console.error(err);
            document.getElementById('status').innerText = "Erro ao conectar no nó";
            document.getElementById('status').className = "status";
        }
    }

    function renderMessage(text, hex, block, hash) {
        const feed = document.getElementById('feed');
        if(feed.innerText.includes('Aguardando')) feed.innerHTML = '';
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div><strong>Bloco:</strong> #${block} | <strong>Tx:</strong> ${hash.substring(0,15)}...</div>
            <div class="hex">HEX: ${hex}</div>
            <div class="text">📝 Mensagem: ${text}</div>
        `;
        feed.insertBefore(card, feed.firstChild);
    }

    // Roda e atualiza a cada 20 segundos
    checkNodeUpdates();
    setInterval(checkNodeUpdates, 20000);
</script>
</body>
</html>
