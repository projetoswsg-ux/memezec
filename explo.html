<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WOW Hex Identity Lookup</title>
  <style>
    body { font-family: monospace; background: #0f0f12; color: #00ff66; padding: 20px; }
    .card { background: #18181f; border: 1px solid #00ff66; padding: 20px; max-width: 650px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; background: #0f0f12; border: 1px solid #333; color: #fff; font-family: monospace; box-sizing: border-box; }
    button { background: #00ff66; color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #00cc52; }
    .res { background: #0f0f12; border: 1px dashed #00ff66; padding: 15px; margin-top: 15px; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>Consultar Mensagem/Nome On-Chain (Wownero)</h2>
  <label>Cole o Hash da Transação (TXID):</label>
  <input type="text" id="txHash" placeholder="ex: 888d2c... (64 caracteres hex)">
  <button onclick="consultarTx()">BUSCAR DADOS DA ON-CHAIN</button>

  <div class="res" id="resultBox" style="display:none">
    <p>Status: <span id="status" style="color:#fff">-</span></p>
    <p>Payload Raw (Extra Hex): <span id="outHex" style="color:#ff0055">-</span></p>
    <p><strong>Texto UTF-8 Extraído:</strong> <span id="outName" style="color:#00ff66; font-size: 18px;">-</span></p>
  </div>
</div>

<script>
// Converte Hexadecimal puro para String UTF-8
function hexToUtf8(hex) {
  if (!hex) return '';
  let bytes = [];
  for (let c = 0; c < hex.length; c += 2) {
    let byte = parseInt(hex.substr(c, 2), 16);
    if (!isNaN(byte)) bytes.push(byte);
  }
  
  // Usa o TextDecoder nativo do JS para decodificar UTF-8 corretamente (inclui acentos e emojis)
  try {
    const decoder = new TextDecoder('utf-8');
    return decoder.decode(new Uint8Array(bytes));
  } catch (e) {
    return '';
  }
}

// Extrai trechos de texto legível de um bloco de Hex
function extractPrintableText(text) {
  // Remove caracteres de controle irrelevantes do protocolo CryptoNote mantendo letras, números e símbolos
  return text.replace(/[^\x20-\x7E\xA0-\xFF]/g, '').trim();
}

async function consultarTx() {
  const txid = document.getElementById('txHash').value.trim();
  if (!txid || txid.length !== 64) {
    alert("Digite uma Hash de Transação (TXID) válida com 64 caracteres.");
    return;
  }

  document.getElementById('resultBox').style.display = "block";
  document.getElementById('status').innerText = "Buscando no explorador público...";
  document.getElementById('outHex').innerText = "-";
  document.getElementById('outName').innerText = "-";

  try {
    const response = await fetch(`https://explore.wownero.com/api/transaction/${txid}`);
    
    if (!response.ok) {
      throw new Error(`Transação não encontrada (HTTP Status: ${response.status})`);
    }

    const data = await response.json();
    console.log("JSON Bruto da API:", data);

    // 1. Tenta capturar o Payment ID tradicional
    let paymentIdHex = data?.tx?.payment_id || data?.tx_details?.payment_id || "";
    
    // 2. Pega o campo extra (onde ficam chaves públicas e a mensagem em Hex)
    let extraHex = data?.tx?.extra || "";

    if (paymentIdHex && paymentIdHex !== "0000000000000000") {
      const decoded = hexToUtf8(paymentIdHex);
      document.getElementById('status').innerText = "Sucesso (Encontrado via Payment ID)!";
      document.getElementById('outHex').innerText = paymentIdHex;
      document.getElementById('outName').innerText = decoded;
    } else if (extraHex) {
      // Faz a varredura completa da estrutura extra em Hex
      const rawDecoded = hexToUtf8(extraHex);
      const cleanText = extractPrintableText(rawDecoded);

      if (cleanText.length > 0) {
        document.getElementById('status').innerText = "Sucesso (Extraído do payload Extra)!";
        document.getElementById('outHex').innerText = extraHex;
        document.getElementById('outName').innerText = cleanText;
      } else {
        document.getElementById('status').innerText = "Payload 'extra' encontrado, mas contém apenas chaves criptográficas sem texto legível.";
        document.getElementById('outHex').innerText = extraHex;
        document.getElementById('outName').innerText = "Nenhum texto UTF-8 identificado";
      }
    } else {
      document.getElementById('status').innerText = "Transação encontrada, mas o campo 'extra' veio vazio.";
    }

  } catch (err) {
    document.getElementById('status').innerText = "Erro ao consultar: " + err.message;
  }
}
</script>

</body>
</html>
