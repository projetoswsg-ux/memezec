<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WOW Hex Identity Lookup</title>
  <style>
    body { font-family: monospace; background: #0f0f12; color: #00ff66; padding: 20px; }
    .card { background: #18181f; border: 1px solid #00ff66; padding: 20px; max-width: 650px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; background: #0f0f12; border: 1px solid #333; color: #fff; font-family: monospace; }
    button { background: #00ff66; color: #000; font-weight: bold; cursor: pointer; border: none; }
    .res { background: #0f0f12; border: 1px dashed #00ff66; padding: 15px; margin-top: 15px; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>Consultar Nome por Hash de TX (Wownero)</h2>
  <label>Cole o Hash da Transação (TXID):</label>
  <input type="text" id="txHash" placeholder="ex: 888d2c... (64 caracteres hex)">
  <button onclick="consultarTx()">BUSCAR DADOS DA ON-CHAIN</button>

  <div class="res" id="resultBox" style="display:none">
    <p>Status: <span id="status" style="color:#fff">-</span></p>
    <p>Payment ID (Hex): <span id="outHex" style="color:#ff0055">-</span></p>
    <p><strong>Nome / Identity Decodificado:</strong> <span id="outName" style="color:#00ff66; font-size: 18px;">-</span></p>
  </div>
</div>

<script>
// Converte o Hex de volta para UTF-8 (Nome Original)
function hexToString(hex) {
  let str = '';
  // Remove o padding de zeros
  let cleanHex = hex.replace(/(00)+$/, '');
  for (let i = 0; i < cleanHex.length; i += 2) {
    let code = parseInt(cleanHex.substr(i, 2), 16);
    if (!isNaN(code) && code > 0) {
      str += String.fromCharCode(code);
    }
  }
  return str;
}

async function consultarTx() {
  const txid = document.getElementById('txHash').value.trim();
  if (!txid || txid.length !== 64) {
    alert("Digite uma Hash de Transação (TXID) válida com 64 caracteres.");
    return;
  }

  document.getElementById('resultBox').style.display = "block";
  document.getElementById('status').innerText = "Buscando no explorador público...";

  try {
    // Exemplo usando a API pública do explorador Wownero
    // (Caso uma caia, você pode colocar um array de fallback com outros mirrors)
    const response = await fetch(`https://explore.wownero.com/api/transaction/${txid}`);
    
    if (!response.ok) {
      throw new Error("Transação não encontrada ou erro na API");
    }

    const data = await response.json();
    
    // Extrai o payment_id do JSON da transação
    const paymentIdHex = data.tx.payment_id || data.tx.extra_payment_id || "0000000000000000";

    if (paymentIdHex && paymentIdHex !== "0000000000000000") {
      const decodedName = hexToString(paymentIdHex);
      document.getElementById('status').innerText = "Sucesso!";
      document.getElementById('outHex').innerText = paymentIdHex;
      document.getElementById('outName').innerText = decodedName || "Indefinido";
    } else {
      document.getElementById('status').innerText = "Esta transação não possui um Payment ID / Nome atrelado.";
    }

  } catch (err) {
    document.getElementById('status').innerText = "Erro ao consultar: " + err.message;
  }
}
</script>

</body>
</html>
